name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real student names, addresses, or locations.**
        Security or privacy problems go to [private reporting](../security/advisories/new), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, device (Pi), driver-ui, ios, web, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Pi OS release, iOS version, browser, etc.
