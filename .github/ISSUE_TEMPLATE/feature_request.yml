name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom?
      description: Driver, student, guardian, or school staff?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: docs
    attributes:
      label: Related spec section
      description: Link the docs/ file this touches, if any.
