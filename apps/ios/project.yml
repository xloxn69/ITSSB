# XcodeGen spec. The .xcodeproj is generated (gitignored): run `xcodegen` in apps/ios.
name: ITSSB
options:
  bundleIdPrefix: org.itssb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  ITSSBDesignSystem:
    path: Packages/ITSSBDesignSystem
  # Convex Swift client (docs/06 §2). Pinned exactly; bump deliberately.
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ITSSB:
    type: application
    platform: iOS
    sources: [ITSSB]
    dependencies:
      - package: ITSSBDesignSystem
      - package: ConvexMobile
    info:
      path: ITSSB/Info.plist
      properties:
        CFBundleDisplayName: ITSSB
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Wire config into the app without hardcoding (see Config/*.xcconfig).
        ConvexURL: $(CONVEX_URL)
        # Build identity (App/BuildInfo.swift, docs/14 §1-2).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSSBEnvironment: $(ITSSB_ENVIRONMENT)
        ITSSBSourceRevision: $(ITSSB_SOURCE_REVISION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ITSSB_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ITSSB_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ITSSBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ITSSBTests
      # The shared contract fixtures (docs/08 §10), decoded by the DTO tests.
      - path: ../../packages/contracts/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ITSSB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ITSSB:
    build:
      targets:
        ITSSB: all
        ITSSBTests: [test]
    test:
      targets: [ITSSBTests]
      gatherCoverageData: true
